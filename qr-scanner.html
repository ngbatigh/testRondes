<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lecteur Code QR</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 500px;
      }

      .header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
      }

      .header h1 {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 16px;
        opacity: 0.9;
      }

      .content {
        width: 100%;
      }

      /* États de l'interface */
      .hidden {
        display: none !important;
      }

      /* Bouton de démarrage */
      .start-section {
        display: flex;
        justify-content: center;
      }

      .btn-scan {
        background-color: white;
        color: #667eea;
        border: none;
        padding: 16px 32px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .btn-scan:active {
        transform: scale(0.98);
      }

      .btn-icon {
        font-size: 24px;
      }

      /* Scanner */
      .scanner-section {
        position: relative;
        background-color: #000;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .scanner-video {
        width: 100%;
        height: auto;
        display: block;
      }

      .scanner-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }

      .scanner-frame {
        width: 250px;
        height: 250px;
        border: 3px solid #00ff00;
        border-radius: 12px;
        box-shadow: inset 0 0 0 9999px rgba(0, 0, 0, 0.5);
      }

      .scanner-text {
        color: white;
        font-size: 14px;
        margin-top: 30px;
        text-align: center;
        font-weight: 500;
      }

      .btn-cancel {
        width: 100%;
        padding: 16px;
        background-color: rgba(255, 255, 255, 0.15);
        color: white;
        border: none;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .btn-cancel:active {
        background-color: rgba(255, 255, 255, 0.25);
      }

      /* Résultat */
      .result-section {
        background-color: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      }

      .result-title {
        color: #667eea;
        font-size: 20px;
        margin-bottom: 20px;
        font-weight: 600;
      }

      .result-content {
        margin-bottom: 25px;
      }

      .result-label {
        color: #666;
        font-size: 14px;
        margin-bottom: 12px;
        font-weight: 500;
      }

      .result-box {
        background-color: #f5f5f5;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
      }

      .result-text {
        color: #333;
        font-size: 14px;
        margin: 0;
        word-break: break-all;
        line-height: 1.5;
      }

      .action-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn-primary {
        background-color: white;
        color: #667eea;
        border: none;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }

      .btn-primary:active {
        transform: scale(0.98);
      }

      .btn-secondary {
        background-color: rgba(255, 255, 255, 0.2);
        color: white;
        border: 2px solid white;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .btn-secondary:active {
        background-color: rgba(255, 255, 255, 0.3);
      }

      /* Erreur */
      .error-section {
        background-color: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        text-align: center;
      }

      .error-message {
        color: #d32f2f;
        font-size: 16px;
        margin-bottom: 20px;
      }

      /* Canvas caché */
      #scanner-canvas {
        display: none;
      }

      /* Responsive */
      @media (max-width: 400px) {
        .header h1 {
          font-size: 26px;
        }

        .header p {
          font-size: 14px;
        }

        .result-section {
          padding: 20px;
        }

        .btn-scan {
          padding: 14px 24px;
          font-size: 15px;
        }

        .scanner-frame {
          width: 200px;
          height: 200px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- En-tête -->
      <div class="header">
        <h1>Lecteur Code QR</h1>
        <p>Scannez rapidement les codes QR avec votre téléphone</p>
      </div>

      <div class="content">
        <!-- Section de démarrage -->
        <div class="start-section" id="startSection">
          <button class="btn-scan" onclick="startScanning()">
            <span class="btn-icon">📱</span>
            <span>Lancer le scan QR</span>
          </button>
        </div>

        <!-- Section scanner -->
        <div class="scanner-section hidden" id="scannerSection">
          <video class="scanner-video" id="video" autoplay playsinline></video>
          <div class="scanner-overlay">
            <div class="scanner-frame"></div>
            <p class="scanner-text">Pointez le code QR vers la caméra</p>
          </div>
          <button class="btn-cancel" onclick="stopScanning()">Annuler</button>
        </div>

        <!-- Section résultat -->
        <div class="result-section hidden" id="resultSection">
          <h2 class="result-title">✓ Code détecté</h2>
          <div class="result-content">
            <p class="result-label">Contenu du code QR:</p>
            <div class="result-box">
              <p class="result-text" id="resultText"></p>
            </div>
          </div>
          <div class="action-buttons">
            <button class="btn-secondary" onclick="copyToClipboard()">
              📋 Copier
            </button>
            <button
              class="btn-secondary hidden"
              id="openButton"
              onclick="openResult()"
            >
              🔗 Ouvrir le lien
            </button>
            <button class="btn-primary" onclick="startScanning()">
              Scanner à nouveau
            </button>
          </div>
        </div>

        <!-- Section erreur -->
        <div class="error-section hidden" id="errorSection">
          <p class="error-message" id="errorMessage"></p>
          <button class="btn-primary" onclick="closeError()">Fermer</button>
        </div>
      </div>
    </div>

    <!-- Canvas caché pour traiter les images -->
    <canvas id="scanner-canvas"></canvas>

    <script>
      let isScanning = false;
      let stream = null;
      let currentResult = null;

      // Démarrer le scan
      async function startScanning() {
        try {
          // Masquer les sections précédentes
          document.getElementById("startSection").classList.add("hidden");
          document.getElementById("resultSection").classList.add("hidden");
          document.getElementById("errorSection").classList.add("hidden");

          // Afficher le scanner
          document.getElementById("scannerSection").classList.remove("hidden");
          isScanning = true;

          // Demander l'accès à la caméra
          const constraints = {
            video: {
              facingMode: "environment", // Caméra arrière
            },
          };

          stream = await navigator.mediaDevices.getUserMedia(constraints);
          const video = document.getElementById("video");
          video.srcObject = stream;

          // Démarrer la lecture des codes QR
          scanQRCode();
        } catch (error) {
          console.error("Erreur:", error);
          showError(
            "Impossible d'accéder à la caméra. Vérifiez les permissions.",
          );
          document.getElementById("startSection").classList.remove("hidden");
          document.getElementById("scannerSection").classList.add("hidden");
        }
      }

      // Arrêter le scan
      function stopScanning() {
        isScanning = false;
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
        document.getElementById("scannerSection").classList.add("hidden");
        document.getElementById("startSection").classList.remove("hidden");
      }

      // Scanner en continu
      function scanQRCode() {
        const video = document.getElementById("video");
        const canvas = document.getElementById("scanner-canvas");
        const ctx = canvas.getContext("2d");

        const scan = () => {
          if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(
              0,
              0,
              canvas.width,
              canvas.height,
            );

            // Utiliser jsQR pour décoder le code
            const code = jsQR(imageData.data, canvas.width, canvas.height);

            if (code) {
              // Code trouvé!
              currentResult = code.data;
              stopScanning();
              showResult(code.data);
              return;
            }
          }

          if (isScanning) {
            requestAnimationFrame(scan);
          }
        };

        requestAnimationFrame(scan);
      }

      // Afficher le résultat
      function showResult(data) {
        document.getElementById("resultText").textContent = data;
        document.getElementById("resultSection").classList.remove("hidden");

        // Afficher le bouton "Ouvrir" si c'est une URL
        const openButton = document.getElementById("openButton");
        if (data.startsWith("http://") || data.startsWith("https://")) {
          openButton.classList.remove("hidden");
        } else {
          openButton.classList.add("hidden");
        }
      }

      // Copier dans le presse-papiers
      function copyToClipboard() {
        if (currentResult) {
          navigator.clipboard
            .writeText(currentResult)
            .then(() => {
              alert("✓ Copié dans le presse-papiers!");
            })
            .catch((err) => {
              console.error("Erreur de copie:", err);
            });
        }
      }

      // Ouvrir le lien
      function openResult() {
        if (currentResult) {
          try {
            new URL(currentResult);
            window.open(currentResult, "_blank");
          } catch {
            showError("Ce n'est pas une URL valide");
          }
        }
      }

      // Afficher une erreur
      function showError(message) {
        document.getElementById("errorMessage").textContent = message;
        document.getElementById("errorSection").classList.remove("hidden");
      }

      // Fermer l'erreur
      function closeError() {
        document.getElementById("errorSection").classList.add("hidden");
        document.getElementById("startSection").classList.remove("hidden");
      }
    </script>
  </body>
</html>
